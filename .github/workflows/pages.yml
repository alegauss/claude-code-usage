name: Verify and deploy to GitHub Pages

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  verify:
    name: Verify page
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dev dependencies
        run: npm install --no-audit --no-fund

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Check palette
        run: npm run check:palette

      - name: Check rendered page
        run: npm run check:page

  deploy:
    name: Deploy
    # Only publish from main; pull requests stop at verification.
    if: github.event_name != 'pull_request'
    needs: verify
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      # The page is the artifact — there is no build step. index.html carries
      # its own CSS, JS and favicon; the four files beside it are the ones that
      # cannot be inlined, because crawlers fetch them over HTTP by path.
      # Tooling still stays out of the deploy.
      - name: Assemble site
        run: |
          mkdir -p _site
          cp index.html og.png robots.txt sitemap.xml llms.txt _site/

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - id: deployment
        uses: actions/deploy-pages@v4
